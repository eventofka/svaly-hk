<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f4ef">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Testovník – Svaly hornej končatiny</title>
<style>
:root{
  --bg:#f6f4ef; --card:#fff; --ink:#1d2228; --muted:#6b7280; --line:#e5e1d8;
  --accent:#b4432f; --accent-soft:#f6e3de; --ok:#1f7a4d; --ok-soft:#dff3e8; --bad:#b3261e; --bad-soft:#fbe2e0;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#15171a;--card:#1f2226;--ink:#eceae5;--muted:#9aa0a8;--line:#2f3338;
  --accent:#e0735d;--accent-soft:#3a2520;--ok:#5cc28d;--ok-soft:#1d3428;--bad:#f07b72;--bad-soft:#3d2120;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
h1 small{display:block;font-size:13px;font-weight:500;color:var(--muted)}
.tabs{display:flex;gap:6px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:999px;cursor:pointer;font-size:14px}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.card+.card{margin-top:14px}
h2{font-size:17px;margin:0 0 12px}
.muted{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px;user-select:none;background:transparent;color:var(--ink)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip .n{color:var(--muted);font-size:12px;margin-left:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.btn{border:0;background:var(--accent);color:#fff;padding:11px 18px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:13px}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 14px}
.prog>div{height:100%;background:var(--accent);transition:width .25s}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px;margin-bottom:10px}
.q{font-size:19px;font-weight:600;margin:0 0 16px;line-height:1.4}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;font-size:15.5px;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:0 0 26px;height:26px;border-radius:7px;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--muted)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.opt.bad .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:6px;padding:12px 14px;border-radius:12px;background:var(--bg);font-size:14px}
.fb b.ok{color:var(--ok)} .fb b.bad{color:var(--bad)}
.mc{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;margin-top:8px;font-size:14px}
.mc dt{color:var(--muted)} .mc dd{margin:0}
.score{font-size:44px;font-weight:800;letter-spacing:-.02em}
.wrong-item{border-top:1px solid var(--line);padding:10px 0;font-size:14px}
.wrong-item .ans{color:var(--ok)} .wrong-item .yours{color:var(--bad)}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
input[type=search]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px}
.mcard{border-top:1px solid var(--line);padding:12px 0}
.mcard h3{margin:0 0 2px;font-size:16px}
.kbd{font-size:12px;color:var(--muted);margin-top:10px}
select{padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px}
.hidden{display:none}

html{-webkit-text-size-adjust:100%}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.qbar{position:sticky;bottom:0;margin:14px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:10px}
.qbar .btn{flex:1;padding:15px;font-size:16px}
.qbar .ghost{flex:0 0 auto}
.qtop{position:sticky;top:0;background:var(--bg);padding:8px 0 2px;z-index:2}
@media (max-width:560px){
  .wrap{padding:12px 14px 20px}
  .card{padding:16px}
  .q{font-size:18px}
  .opt{padding:14px;font-size:16px;min-height:54px}
  .mc{grid-template-columns:84px 1fr;font-size:13.5px}
  .chip{padding:8px 13px}
  .row .btn:not(.small){flex:1}
  select{flex:1}
}
@media (hover:none){.kbd{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Musculi membri superioris<small>Testovník – svaly hornej končatiny</small></h1>
    <div class="tabs">
      <button class="tab on" data-tab="test">Test</button>
      <button class="tab" data-tab="cheat">Ťahák</button>
    </div>
  </header>

  <!-- START -->
  <section id="start">
    <div class="card">
      <h2>Nastavenie testu</h2>
      <div class="muted">Vyber okruhy (predvolene všetky):</div>
      <div class="chips" id="secChips"></div>
      <div class="row">
        <button class="btn ghost small" id="allSec">Všetky</button>
        <button class="btn ghost small" id="noSec">Žiadne</button>
      </div>
      <div class="row">
        <label class="muted" for="count">Počet otázok:</label>
        <select id="count">
          <option value="20">20</option>
          <option value="50" selected>50</option>
          <option value="100">100</option>
          <option value="200">200</option>
          <option value="0">Všetky vybrané</option>
        </select>
        <span class="muted" id="avail"></span>
      </div>
      <div class="row">
        <button class="btn" id="go">Spustiť test</button>
        <button class="btn ghost" id="goWrong">Opakovať chybné (<span id="wrongN">0</span>)</button>
      </div>
    </div>
    <div class="card">
      <h2>Tvoj progres</h2>
      <div class="stats" id="stats"></div>
      <div class="row"><button class="btn ghost small" id="reset">Vymazať progres</button></div>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="qtop"><div class="meta"><span id="qPos"></span><span id="qScore"></span></div>
    <div class="prog"><div id="bar"></div></div></div>
    <div class="card">
      <span class="tag" id="qTag"></span>
      <p class="q" id="qText"></p>
      <div id="opts"></div>
      <div id="fb"></div>
      <div class="kbd">Klávesy 1–4 = odpoveď, Enter = ďalej</div>
    </div>
    <div class="qbar">
      <button class="btn ghost" id="quit">Ukončiť</button>
      <button class="btn" id="next" disabled>Ďalej →</button>
    </div>
  </section>

  <!-- RESULT -->
  <section id="result" class="hidden">
    <div class="card">
      <div class="muted">Výsledok</div>
      <div class="score" id="rScore"></div>
      <div class="muted" id="rText"></div>
      <div class="row">
        <button class="btn" id="again">Nový test</button>
        <button class="btn ghost" id="retryWrong">Zopakovať chybné z tohto testu</button>
      </div>
    </div>
    <div class="card" id="rWrongCard">
      <h2>Chybné odpovede</h2>
      <div id="rWrong"></div>
    </div>
  </section>

  <!-- CHEAT -->
  <section id="cheat" class="hidden">
    <div class="card">
      <input type="search" id="cs" placeholder="Hľadať sval, nerv, úpon…">
      <div id="cheatList"></div>
    </div>
  </section>
</div>

<script>
const DATA = {"groups": {"humeri": "Mm. humeri (svaly pletenca hornej končatiny)", "brachii_v": "Mm. brachii – ventrálna skupina", "brachii_d": "Mm. brachii – dorzálna skupina", "ab_v": "Mm. antebrachii – ventrálna skupina", "ab_l": "Mm. antebrachii – laterálna skupina", "ab_d": "Mm. antebrachii – dorzálna skupina", "thenar": "Mm. manus – mm. thenaris", "hypothenar": "Mm. manus – mm. hypothenaris", "interossei": "Mm. manus – mm. interossei", "lumbricales": "Mm. manus – mm. lumbricales", "general": "Všeobecné / súhrnné otázky"}, "cards": [{"name": "M. deltoideus", "group": "Mm. humeri (svaly pletenca hornej končatiny)", "origin": "Spina scapulae, acromion, clavicula", "ins": "Tuberositas deltoidea humeri", "nerve": "n. axillaris", "func": "Ventrálna časť: flexia a endorotácia; dorzálna časť: dorzálna flexia a exorotácia; abdukcia a addukcia ramena"}, {"name": "M. teres minor", "group": "Mm. humeri (svaly pletenca hornej končatiny)", "origin": "Margo lateralis scapulae", "ins": "Tuberculum majus humeri", "nerve": "n. axillaris", "func": "Exorotácia, mierna addukcia ramena"}, {"name": "M. teres major", "group": "Mm. humeri (svaly pletenca hornej končatiny)", "origin": "Angulus inferior scapulae, margo lateralis scapulae", "ins": "Crista tuberculi minoris humeri", "nerve": "n. subscapularis", "func": "Endorotácia, dorzálna flexia a addukcia humeru"}, {"name": "M. supraspinatus", "group": "Mm. humeri (svaly pletenca hornej končatiny)", "origin": "Fossa supraspinata", "ins": "Tuberculum majus humeri", "nerve": "n. suprascapularis", "func": "Abdukcia v art. humeri (ramennom kĺbe)"}, {"name": "M. infraspinatus", "group": "Mm. humeri (svaly pletenca hornej končatiny)", "origin": "Fossa infraspinata", "ins": "Tuberculum majus humeri", "nerve": "n. suprascapularis", "func": "Vonkajšia rotácia (exorotácia) ramena"}, {"name": "M. subscapularis", "group": "Mm. humeri (svaly pletenca hornej končatiny)", "origin": "Fossa subscapularis", "ins": "Tuberculum minus humeri", "nerve": "n. subscapularis", "func": "Endorotácia a addukcia humeru"}, {"name": "M. biceps brachii", "group": "Mm. brachii – ventrálna skupina", "origin": "Caput longum – tuberculum supraglenoidale; caput breve – processus coracoideus", "ins": "Tuberositas radii; lacertus fibrosus (aponeuróza smerom k mediálnemu epikondylu)", "nerve": "n. musculocutaneus", "func": "Flexia v art. cubiti, supinácia predlaktia; v art. humeri abdukcia a addukcia"}, {"name": "M. coracobrachialis", "group": "Mm. brachii – ventrálna skupina", "origin": "Processus coracoideus", "ins": "Crista tuberculi minoris humeri", "nerve": "n. musculocutaneus", "func": "Ventrálna flexia v art. humeri, pomocná addukcia a endorotácia humeru"}, {"name": "M. brachialis", "group": "Mm. brachii – ventrálna skupina", "origin": "Ventrálna (predná) plocha humeru", "ins": "Tuberositas ulnae", "nerve": "n. musculocutaneus", "func": "Flexia v art. cubiti (lakťovom kĺbe)"}, {"name": "M. triceps brachii", "group": "Mm. brachii – dorzálna skupina", "origin": "Caput longum – tuberculum infraglenoidale; caput laterale – proximálne od sulcus n. radialis; caput mediale – distálne od sulcus n. radialis", "ins": "Olecranon ulnae", "nerve": "n. radialis", "func": "Extenzia v art. cubiti; caput longum – dorzálna flexia a addukcia ramena"}, {"name": "M. anconeus", "group": "Mm. brachii – dorzálna skupina", "origin": "Epicondylus lateralis humeri", "ins": "Olecranon ulnae", "nerve": "n. radialis", "func": "Extenzia v art. cubiti (ako m. triceps brachii)"}, {"name": "M. articularis cubiti", "group": "Mm. brachii – dorzálna skupina", "origin": "Mediálna hlava m. triceps brachii", "ins": "Kĺbové púzdro art. cubiti", "nerve": "n. radialis", "func": "Pri kontrakcii napína puzdro art. cubiti"}, {"name": "M. palmaris longus", "group": "Mm. antebrachii – ventrálna skupina", "origin": "Epicondylus medialis humeri", "ins": "Aponeurosis palmaris", "nerve": "n. medianus", "func": "Flexia ruky, lakťa a základných článkov prstov"}, {"name": "M. flexor carpi radialis", "group": "Mm. antebrachii – ventrálna skupina", "origin": "Epicondylus medialis humeri", "ins": "Báza 2. metakarpu", "nerve": "n. medianus", "func": "Flexia zápästia, radiálna dukcia ruky, flexia lakťa"}, {"name": "M. flexor carpi ulnaris", "group": "Mm. antebrachii – ventrálna skupina", "origin": "Caput humerale – epicondylus medialis humeri; caput ulnare – mediálna plocha olecranonu", "ins": "Os pisiforme, 5. metakarp", "nerve": "n. ulnaris", "func": "Flexia zápästia, ulnárna dukcia ruky"}, {"name": "M. pronator teres", "group": "Mm. antebrachii – ventrálna skupina", "origin": "Caput humerale – epicondylus medialis humeri; caput ulnare – processus coronoideus ulnae", "ins": "Vonkajšia (laterálna) hrana rádia v hornej tretine", "nerve": "n. medianus", "func": "Pronácia predlaktia, pomocná flexia lakťa"}, {"name": "M. flexor digitorum superficialis", "group": "Mm. antebrachii – ventrálna skupina", "origin": "Caput humeroulnare – epicondylus medialis humeri a tuberositas ulnae; caput radiale – predná plocha rádia", "ins": "Phalanx media (stredné články) trojčlánkových prstov", "nerve": "n. medianus", "func": "Flexia zápästia a prstov (okrem 3. článku), pomocná flexia v lakti"}, {"name": "M. flexor digitorum profundus", "group": "Mm. antebrachii – ventrálna skupina", "origin": "Predná plocha ulny a rádia, membrana interossea", "ins": "Báza distálnych článkov prstov 2.–5.", "nerve": "n. medianus (pre 2. a 3. prst) a n. ulnaris (pre 4. a 5. prst)", "func": "Flexia distálnych článkov prstov 2.–5."}, {"name": "M. flexor pollicis longus", "group": "Mm. antebrachii – ventrálna skupina", "origin": "Epicondylus medialis humeri, predná plocha rádia", "ins": "Báza distálneho článku palca (medzi dvoma hlavami krátkeho flexora palca)", "nerve": "n. medianus", "func": "Flexia palca, flexia zápästia"}, {"name": "M. pronator quadratus", "group": "Mm. antebrachii – ventrálna skupina", "origin": "Predná plocha ulny (distálna štvrtina), membrana interossea", "ins": "P Iba m. flexor digiti minimi brevis"], "s": "hypothenar", "m": null, "k": "všeobecné"}, {"q": "Z ktorej kosti odstupuje m. abductor digiti minimi?", "o": ["Os pisiforme", "Hamulus ossis hamati", "Os capitatum", "Os trapezium"], "s": "hypothenar", "m": null, "k": "všeobecné"}, {"q": "Ktorý sval sa upína na kĺbové púzdro lakťového kĺbu?", "o": ["M. articularis cubiti", "M. anconeus", "M. brachialis", "M. supinator"], "s": "brachii_d", "m": null, "k": "všeobecné"}, {"q": "Ktorý sval sa upína na tuberositas ulnae?", "o": ["M. brachialis", "M. biceps brachii", "M. supinator", "M. pronator teres"], "s": "brachii_v", "m": null, "k": "všeobecné"}, {"q": "Ktorý sval sa upína na tuberositas deltoidea?", "o": ["M. deltoideus", "M. coracobrachialis", "M. teres major", "M. brachialis"], "s": "humeri", "m": null, "k": "všeobecné"}, {"q": "Ktoré tri svaly predlaktia smerujú k palcu z dorzálnej plochy ulny/rádia?", "o": ["M. abductor pollicis longus, m. extensor pollicis brevis, m. extensor pollicis longus", "M. flexor pollicis longus, m. opponens pollicis, m. adductor pollicis", "M. extensor indicis, m. extensor digitorum, m. extensor digiti minimi", "M. brachioradialis, m. supinator, m. pronator teres"], "s": "ab_d", "m": null, "k": "všeobecné"}, {"q": "Ktorý sval je v prezentácii zaradený do laterálnej skupiny predlaktia?", "o": ["M. supinator", "M. extensor carpi ulnaris", "M. pronator teres", "M. extensor indicis"], "s": "ab_l", "m": null, "k": "všeobecné"}, {"q": "Koľko svalov tvorí laterálnu skupinu predlaktia podľa prezentácie?", "o": ["4", "3", "5", "7"], "s": "ab_l", "m": null, "k": "všeobecné"}, {"q": "Koľko svalov tvorí ventrálnu skupinu predlaktia podľa prezentácie?", "o": ["8", "6", "4", "10"], "s": "ab_v", "m": null, "k": "všeobecné"}, {"q": "Koľko svalov tvorí dorzálnu skupinu predlaktia podľa prezentácie?", "o": ["7", "4", "8", "5"], "s": "ab_d", "m": null, "k": "všeobecné"}, {"q": "Koľko svalov tvorí skupinu mm. humeri podľa prezentácie?", "o": ["6", "4", "5", "8"], "s": "humeri", "m": null, "k": "všeobecné"}, {"q": "Koľko svalov tvorí thenar podľa prezentácie?", "o": ["4", "3", "5", "2"], "s": "thenar", "m": null, "k": "všeobecné"}, {"q": "Koľko svalov tvorí hypothenar podľa prezentácie?", "o": ["4", "3", "5", "2"], "s": "hypothenar", "m": null, "k": "všeobecné"}, {"q": "Ktoré svaly patria do dorzálnej skupiny mm. brachii?", "o": ["M. triceps brachii, m. anconeus, m. articularis cubiti", "M. biceps brachii, m. brachialis, m. coracobrachialis", "M. triceps brachii, m. brachioradialis, m. supinator", "M. anconeus, m. teres major, m. teres minor"], "s": "brachii_d", "m": null, "k": "všeobecné"}, {"q": "Ktoré svaly patria do ventrálnej skupiny mm. brachii?", "o": ["M. biceps brachii, m. coracobrachialis, m. brachialis", "M. triceps brachii, m. anconeus, m. articularis cubiti", "M. biceps brachii, m. brachioradialis, m. pronator teres", "M. coracobrachialis, m. deltoideus, m. subscapularis"], "s": "brachii_v", "m": null, "k": "všeobecné"}]};
const Q = DATA.questions, CARDS = DATA.cards, GROUPS = DATA.groups;
const $ = s => document.querySelector(s);
const el = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// ---- storage (safe) ----
let store = { wrong: {}, seen: 0, correct: 0 };
try { const s = JSON.parse(localStorage.getItem('svalyHK') || 'null'); if (s) store = Object.assign(store, s); } catch (e) {}
const save = () => { try { localStorage.setItem('svalyHK', JSON.stringify(store)); } catch (e) {} };

// ---- start screen ----
const order = ["humeri","brachii_v","brachii_d","ab_v","ab_l","ab_d","thenar","hypothenar","interossei","lumbricales","general"];
const selected = new Set(order);
const SHORT = {humeri:"Mm. humeri", brachii_v:"Paža – ventr.", brachii_d:"Paža – dorz.", ab_v:"Predlaktie – ventr.", ab_l:"Predlaktie – lat.", ab_d:"Predlaktie – dorz.", thenar:"Thenar", hypothenar:"Hypothenar", interossei:"Interossei", lumbricales:"Lumbricales", general:"Súhrnné"};
const counts = {}; Q.forEach(q => counts[q.s] = (counts[q.s] || 0) + 1);
function renderChips() {
  const box = $('#secChips'); box.innerHTML = '';
  order.forEach(k => {
    if (!counts[k]) return;
    const c = el('button', 'chip' + (selected.has(k) ? ' on' : ''));
    c.textContent = SHORT[k] || GROUPS[k]; const n = el('span', 'n', counts[k]); c.appendChild(n);
    c.onclick = () => { selected.has(k) ? selected.delete(k) : selected.add(k); renderChips(); };
    box.appendChild(c);
  });
  const av = Q.filter(q => selected.has(q.s)).length;
  $('#avail').textContent = `(k dispozícii ${av} otázok)`;
  $('#go').disabled = av === 0;
}
function renderStats() {
  const w = Object.keys(store.wrong).length;
  $('#wrongN').textContent = w; $('#goWrong').disabled = w === 0;
  const pct = store.seen ? Math.round(store.correct / store.seen * 100) : 0;
  $('#stats').innerHTML = '';
  [[Q.length, 'otázok v banke'], [store.seen, 'zodpovedaných'], [pct + ' %', 'úspešnosť'], [w, 'na zopakovanie']].forEach(([v, l]) => {
    const s = el('div', 'stat'); s.appendChild(el('b', null, v)); s.appendChild(el('span', null, l)); $('#stats').appendChild(s);
  });
}
$('#allSec').onclick = () => { order.forEach(k => selected.add(k)); renderChips(); };
$('#noSec').onclick = () => { selected.clear(); renderChips(); };
$('#reset').onclick = () => { store = { wrong: {}, seen: 0, correct: 0 }; save(); renderStats(); };

// ---- quiz ----
let run = null;
function show(id) { ['start', 'quiz', 'result', 'cheat'].forEach(s => $('#' + s).classList.toggle('hidden', s !== id)); window.scrollTo(0, 0); }
function startRun(idxs) {
  run = { list: idxs, i: 0, ok: 0, wrong: [], answered: false };
  show('quiz'); renderQ();
}
$('#go').onclick = () => {
  let pool = Q.map((q, i) => i).filter(i => selected.has(Q[i].s));
  pool = shuffle(pool); const n = +$('#count').value; if (n) pool = pool.slice(0, n);
  startRun(pool);
};
$('#goWrong').onclick = () => startRun(shuffle(Object.keys(store.wrong).map(Number)));

function renderQ() {
  const qi = run.list[run.i], q = Q[qi];
  run.answered = false;
  $('#qPos').textContent = `Otázka ${run.i + 1} / ${run.list.length}`;
  $('#qScore').textContent = `Správne: ${run.ok}`;
  $('#bar').style.width = (run.i / run.list.length * 100) + '%';
  $('#qTag').textContent = GROUPS[q.s] + ' · ' + q.k;
  $('#qText').textContent = q.q;
  const box = $('#opts'); box.innerHTML = ''; $('#fb').innerHTML = '';
  $('#next').disabled = true;
  run.cur = shuffle(q.o.map((t, i) => ({ t, ok: i === 0 })));
  run.cur.forEach((o, i) => {
    const b = el('button', 'opt'); b.appendChild(el('span', 'k', 'ABCD'[i])); b.appendChild(el('span', null, o.t));
    b.onclick = () => answer(i); box.appendChild(b);
  });
}
function answer(i) {
  if (run.answered) return; run.answered = true;
  const qi = run.list[run.i], q = Q[qi], btns = [...document.querySelectorAll('.opt')];
  const good = run.cur[i].ok;
  btns.forEach((b, j) => { b.disabled = true; if (run.cur[j].ok) b.classList.add('ok'); else if (j === i) b.classList.add('bad'); });
  store.seen++;
  if (good) { run.ok++; store.correct++; delete store.wrong[qi]; }
  else { run.wrong.push({ qi, yours: run.cur[i].t }); store.wrong[qi] = 1; }
  save();
  const fb = $('#fb'); const d = el('div', 'fb');
  const head = el('b', good ? 'ok' : 'bad', good ? 'Správne!' : 'Nesprávne.'); d.appendChild(head);
  if (!good) d.appendChild(document.createTextNode(' Správna odpoveď: ' + q.o[0]));
  if (q.m != null) d.appendChild(cardDl(CARDS[q.m], true));
  fb.appendChild(d);
  $('#qScore').textContent = `Správne: ${run.ok}`;
  $('#next').disabled = false; try { $('#next').focus({preventScroll:true}); } catch(e) {}
}
function cardDl(c, withName) {
  const wrap = el('div');
  if (withName) { const t = el('div', null); t.style.marginTop = '8px'; t.appendChild(el('b', null, c.name)); wrap.appendChild(t); }
  const dl = el('dl', 'mc');
  [['Skupina', c.group], ['Odstup', c.origin], ['Úpon', c.ins], ['Inervácia', c.nerve], ['Funkcia', c.func]].forEach(([k, v]) => {
    dl.appendChild(el('dt', null, k)); dl.appendChild(el('dd', null, v));
  });
  wrap.appendChild(dl); return wrap;
}
$('#next').onclick = () => { if (!run.answered) return; run.i++; run.i >= run.list.length ? finish() : renderQ(); };
$('#quit').onclick = () => finish(true);
document.addEventListener('keydown', e => {
  if ($('#quiz').classList.contains('hidden')) return;
  if (['1', '2', '3', '4'].includes(e.key)) answer(+e.key - 1);
  else if (e.key === 'Enter' && run.answered) { e.preventDefault(); $('#next').click(); }
});
function finish(early) {
  const done = early ? run.i + (run.answered ? 1 : 0) : run.list.length;
  const pct = done ? Math.round(run.ok / done * 100) : 0;
  $('#rScore').textContent = pct + ' %';
  $('#rText').textContent = `${run.ok} správne z ${done} zodpovedaných otázok`;
  const box = $('#rWrong'); box.innerHTML = '';
  $('#rWrongCard').classList.toggle('hidden', run.wrong.length === 0);
  $('#retryWrong').disabled = run.wrong.length === 0;
  run.wrong.forEach(w => {
    const q = Q[w.qi], d = el('div', 'wrong-item');
    d.appendChild(el('div', null, q.q));
    d.appendChild(el('div', 'yours', '✗ ' + w.yours));
    d.appendChild(el('div', 'ans', '✓ ' + q.o[0]));
    box.appendChild(d);
  });
  show('result'); renderStats();
}
$('#again').onclick = () => { show('start'); renderChips(); };
$('#retryWrong').onclick = () => startRun(shuffle(run.wrong.map(w => w.qi)));

// ---- tabs / cheat ----
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  if (t.dataset.tab === 'cheat') { show('cheat'); renderCheat(); } else { show(run && !$('#quiz').dataset.x ? 'start' : 'start'); renderChips(); renderStats(); }
});
function renderCheat() {
  const f = ($('#cs').value || '').toLowerCase();
  const box = $('#cheatList'); box.innerHTML = '';
  let lastG = null;
  CARDS.forEach(c => {
    const hay = Object.values(c).join(' ').toLowerCase(); if (f && !hay.includes(f)) return;
    if (c.group !== lastG) { const h = el('h2', null, c.group); h.style.marginTop = '18px'; box.appendChild(h); lastG = c.group; }
    const m = el('div', 'mcard'); m.appendChild(el('h3', null, c.name));
    const dl = cardDl(c, false); dl.querySelector('dt').remove(); dl.querySelector('dd').remove();
    m.appendChild(dl); box.appendChild(m);
  });
}
$('#cs').oninput = renderCheat;

renderChips(); renderStats();
</script>
</body>
